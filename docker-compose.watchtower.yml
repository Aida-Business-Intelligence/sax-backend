# Stack global do Watchtower — roda UMA ÚNICA vez no servidor.
# Monitora todos os containers que têm a label:
#   com.centurylinklabs.watchtower.enable=true
#
# Portainer: criar stack "watchtower" com este arquivo.
# Env vars necessárias: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

services:
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      REPO_USER: ${DOCKERHUB_USERNAME}
      REPO_PASS: ${DOCKERHUB_TOKEN}
